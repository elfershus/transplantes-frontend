<div class="doctors-list-container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Doctors</mat-card-title>
      </mat-card-header>
      
      <mat-card-content>
        <!-- Filters -->
        <form [formGroup]="filterForm" class="filter-form">
          <div class="filters-grid">
            <mat-form-field appearance="outline">
              <mat-label>First Name</mat-label>
              <input matInput formControlName="firstName" placeholder="Filter by first name">
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>Last Name</mat-label>
              <input matInput formControlName="lastName" placeholder="Filter by last name">
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>Specialty</mat-label>
              <input matInput formControlName="specialty" placeholder="Filter by specialty">
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" placeholder="Filter by email">
            </mat-form-field>
          </div>
          
          <div class="filter-actions">
            <button mat-raised-button color="primary" (click)="resetFilters()">
              <mat-icon>clear</mat-icon> Reset Filters
            </button>
          </div>
        </form>
        
        <!-- Actions -->
        <div class="table-actions">
          <button mat-raised-button color="primary" routerLink="/doctors/new">
            <mat-icon>add</mat-icon> Add Doctor
          </button>
        </div>
        
        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="loading-container">
          <mat-spinner diameter="48"></mat-spinner>
        </div>
        
        <!-- Table -->
        <div class="table-container" *ngIf="!isLoading">
          <table mat-table [dataSource]="doctors" class="mat-elevation-z2">
            <!-- First Name Column -->
            <ng-container matColumnDef="firstName">
              <th mat-header-cell *matHeaderCellDef>First Name</th>
              <td mat-cell *matCellDef="let doctor">{{ doctor.firstName }}</td>
            </ng-container>
            
            <!-- Last Name Column -->
            <ng-container matColumnDef="lastName">
              <th mat-header-cell *matHeaderCellDef>Last Name</th>
              <td mat-cell *matCellDef="let doctor">{{ doctor.lastName }}</td>
            </ng-container>
            
            <!-- Specialty Column -->
            <ng-container matColumnDef="specialty">
              <th mat-header-cell *matHeaderCellDef>Specialty</th>
              <td mat-cell *matCellDef="let doctor">{{ doctor.specialty }}</td>
            </ng-container>
            
            <!-- Email Column -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let doctor">{{ doctor.email }}</td>
            </ng-container>
            
            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let doctor">
                <button mat-icon-button color="primary" [routerLink]="['/doctors', doctor.id]">
                  <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button color="accent" [routerLink]="['/doctors', doctor.id, 'edit']">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteDoctor(doctor)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>
            
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          
          <!-- No data row -->
          <div *ngIf="doctors.length === 0" class="no-data-row">
            No doctors found.
          </div>
          
          <!-- Paginator -->
          <mat-paginator
            [length]="totalItems"
            [pageSize]="pageSize"
            [pageSizeOptions]="[5, 10, 25, 50]"
            [pageIndex]="pageIndex"
            (page)="onPageChange($event)">
          </mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
