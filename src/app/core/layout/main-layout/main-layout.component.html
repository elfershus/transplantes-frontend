<!-- src/app/core/layout/main-layout/main-layout.component.html -->
<div class="app-container">
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">Organ Transplant Management System</span>
      <span class="toolbar-spacer"></span>
      
      <button mat-icon-button [matMenuTriggerFor]="notifications">
        <mat-icon>notifications</mat-icon>
      </button>
      <mat-menu #notifications="matMenu">
        <div class="notifications-container">
          <div class="notification-header">
            <h3>Notifications</h3>
          </div>
          <div class="notification-list">
            <p class="no-notifications">No new notifications</p>
          </div>
        </div>
      </mat-menu>
      
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <div *ngIf="authService.currentUser">
            <p class="user-name">{{ authService.currentUser.firstName }} {{ authService.currentUser.lastName }}</p>
            <p class="user-email">{{ authService.currentUser.email }}</p>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>
  
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav [opened]="sidenavOpened" mode="side" class="sidenav">
        <mat-nav-list>
          <a mat-list-item 
             *ngFor="let item of navigationItems" 
             [routerLink]="item.route" 
             routerLinkActive="active">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        </mat-nav-list>
      </mat-sidenav>
      
      <mat-sidenav-content class="content">
        <router-outlet></router-outlet>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
