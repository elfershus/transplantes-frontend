<button mat-icon-button [matMenuTriggerFor]="notificationsMenu" class="notification-icon">
    <mat-icon [matBadge]="unreadCount" [matBadgeHidden]="unreadCount === 0" matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>
  
  <mat-menu #notificationsMenu="matMenu" xPosition="before" class="notifications-menu">
    <div class="notifications-header">
      <h3>Notifications</h3>
      <button mat-button color="primary" (click)="markAllAsRead($event)" [disabled]="unreadCount === 0">
        Mark all as read
      </button>
    </div>
    
    <mat-divider></mat-divider>
    
    <div class="notifications-list">
      <ng-container *ngIf="notifications.length > 0; else noNotifications">
        <mat-list>
          <mat-list-item *ngFor="let notification of notifications" 
                        [class.unread]="!notification.read"
                        (click)="markAsRead(notification, $event)">
            <mat-icon [color]="getNotificationColor(notification.type)" matListItemIcon>
              {{ getNotificationIcon(notification.type) }}
            </mat-icon>
            <div matListItemTitle>{{ notification.title }}</div>
            <div matListItemLine>{{ notification.message }}</div>
            <div matListItemMeta>{{ getTimeAgo(notification.createdAt) }}</div>
          </mat-list-item>
        </mat-list>
      </ng-container>
      
      <ng-template #noNotifications>
        <div class="no-notifications">
          <p>No notifications.</p>
        </div>
      </ng-template>
    </div>
    
    <mat-divider></mat-divider>
    
    <div class="notifications-footer">
      <button mat-button routerLink="/notifications" (click)="$event.stopPropagation()">
        View all notifications
      </button>
    </div>
  </mat-menu>
